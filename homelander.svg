<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 280" width="200" height="280">
  <defs>
    <!-- 头发渐变 -->
    <linearGradient id="hairGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffe066"/>
      <stop offset="50%" style="stop-color:#f5d442"/>
      <stop offset="100%" style="stop-color:#d4a800"/>
    </linearGradient>
    <!-- 皮肤渐变 -->
    <radialGradient id="skinGrad" cx="50%" cy="40%" r="50%">
      <stop offset="0%" style="stop-color:#ffe0bd"/>
      <stop offset="100%" style="stop-color:#f5c49c"/>
    </radialGradient>
    <!-- 战衣渐变 -->
    <linearGradient id="suitGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#2255bb"/>
      <stop offset="100%" style="stop-color:#1a3a8a"/>
    </linearGradient>
    <!-- 披风渐变 -->
    <linearGradient id="capeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#e63946"/>
      <stop offset="100%" style="stop-color:#8b1a1a"/>
    </linearGradient>
    <!-- 徽章渐变 -->
    <radialGradient id="emblemGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#ffe066"/>
      <stop offset="70%" style="stop-color:#f5d442"/>
      <stop offset="100%" style="stop-color:#c9a800"/>
    </radialGradient>
    <!-- 靴子渐变 -->
    <linearGradient id="bootGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#e63946"/>
      <stop offset="100%" style="stop-color:#9b1b1b"/>
    </linearGradient>
  </defs>

  <!-- 披风 (后面) -->
  <path d="M60,95 Q55,100 50,130 Q45,170 55,210 Q60,225 75,230 L125,230 Q140,225 145,210 Q155,170 150,130 Q145,100 140,95 Z" fill="url(#capeGrad)" opacity="0.95"/>
  <!-- 披风内衬 -->
  <path d="M65,100 Q62,120 58,150 Q55,180 63,215 Q67,222 78,225 L122,225 Q133,222 137,215 Q145,180 142,150 Q138,120 135,100 Z" fill="#c0392b" opacity="0.6"/>
  <!-- 披风褶皱高光 -->
  <path d="M68,110 Q65,140 62,170 Q60,190 65,210" stroke="#ff6b6b" stroke-width="1.5" fill="none" opacity="0.3"/>
  <path d="M132,110 Q135,140 138,170 Q140,190 135,210" stroke="#ff6b6b" stroke-width="1.5" fill="none" opacity="0.3"/>

  <!-- 左腿 -->
  <path d="M78,195 L78,235 Q78,240 82,240 L88,240 Q92,240 92,235 L92,195 Z" fill="url(#suitGrad)"/>
  <!-- 右腿 -->
  <path d="M108,195 L108,235 Q108,240 112,240 L118,240 Q122,240 122,235 L122,195 Z" fill="url(#suitGrad)"/>

  <!-- 左靴 -->
  <path d="M76,232 L76,258 Q76,265 82,265 L90,265 Q96,265 96,258 L96,232 Z" fill="url(#bootGrad)"/>
  <path d="M76,232 L96,232 L96,238 L76,238 Z" fill="#f5d442"/>
  <!-- 右靴 -->
  <path d="M104,232 L104,258 Q104,265 110,265 L118,265 Q124,265 124,258 L124,232 Z" fill="url(#bootGrad)"/>
  <path d="M104,232 L124,232 L124,238 L104,238 Z" fill="#f5d442"/>

  <!-- 躯干/战衣 -->
  <path d="M72,100 Q70,105 70,120 L70,200 Q70,205 75,205 L125,205 Q130,205 130,200 L130,120 Q130,105 128,100 Z" fill="url(#suitGrad)"/>
  <!-- 战衣高光 -->
  <path d="M75,105 Q78,130 78,160" stroke="rgba(255,255,255,0.15)" stroke-width="3" fill="none"/>

  <!-- 左臂 -->
  <path d="M60,105 Q55,108 53,115 L50,160 Q49,168 54,170 L62,170 Q67,168 67,160 L70,115 Q70,108 67,105 Z" fill="url(#suitGrad)"/>
  <!-- 左手 -->
  <ellipse cx="56" cy="174" rx="8" ry="9" fill="url(#skinGrad)"/>
  <!-- 右臂 -->
  <path d="M140,105 Q145,108 147,115 L150,160 Q151,168 146,170 L138,170 Q133,168 133,160 L130,115 Q130,108 133,105 Z" fill="url(#suitGrad)"/>
  <!-- 右手 -->
  <ellipse cx="144" cy="174" rx="8" ry="9" fill="url(#skinGrad)"/>

  <!-- 金色腰带 -->
  <rect x="70" y="188" width="60" height="10" rx="3" fill="#f5d442"/>
  <rect x="93" y="186" width="14" height="14" rx="3" fill="#d4a800" stroke="#f5d442" stroke-width="1"/>

  <!-- 胸前徽章 -->
  <circle cx="100" cy="135" r="18" fill="url(#emblemGrad)" stroke="#c0392b" stroke-width="2.5"/>
  <!-- 鹰/星形图案 -->
  <polygon points="100,121 103,130 113,130 105,136 108,145 100,140 92,145 95,136 87,130 97,130" fill="#c0392b" opacity="0.85"/>
  <!-- 徽章高光 -->
  <ellipse cx="95" cy="128" rx="5" ry="3" fill="rgba(255,255,255,0.3)"/>

  <!-- 脖子 -->
  <rect x="92" y="82" width="16" height="20" rx="6" fill="url(#skinGrad)"/>

  <!-- 头部 -->
  <ellipse cx="100" cy="55" rx="38" ry="42" fill="url(#skinGrad)"/>
  <!-- 脸部轮廓阴影 -->
  <ellipse cx="100" cy="60" rx="35" ry="38" fill="none" stroke="rgba(200,150,100,0.2)" stroke-width="1"/>

  <!-- 耳朵 -->
  <ellipse cx="63" cy="55" rx="6" ry="8" fill="url(#skinGrad)"/>
  <ellipse cx="63" cy="55" rx="3" ry="5" fill="rgba(200,150,100,0.3)"/>
  <ellipse cx="137" cy="55" rx="6" ry="8" fill="url(#skinGrad)"/>
  <ellipse cx="137" cy="55" rx="3" ry="5" fill="rgba(200,150,100,0.3)"/>

  <!-- 头发 - 主体 -->
  <path d="M62,50 Q60,30 70,18 Q80,8 100,5 Q120,8 130,18 Q140,30 138,50 Q138,42 130,35 Q120,25 100,22 Q80,25 70,35 Q62,42 62,50 Z" fill="url(#hairGrad)"/>
  <!-- 头发 - 左侧 -->
  <path d="M62,50 Q58,45 60,38 Q62,32 68,28 Q64,35 63,42 Z" fill="#d4a800"/>
  <!-- 头发 - 右侧翘起 -->
  <path d="M138,50 Q142,45 140,36 Q138,28 133,24 Q137,32 138,40 Z" fill="#d4a800"/>
  <!-- 头发 - 额前刘海 -->
  <path d="M75,35 Q80,28 90,26 Q85,32 82,38 Z" fill="#ffe066" opacity="0.7"/>
  <path d="M105,26 Q115,28 122,34 Q118,30 110,28 Z" fill="#ffe066" opacity="0.5"/>
  <!-- 头发高光 -->
  <path d="M80,15 Q90,10 100,9 Q95,12 88,16 Z" fill="rgba(255,255,255,0.4)"/>

  <!-- 眉毛 -->
  <path d="M78,42 Q83,39 90,41" stroke="#8b6914" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path d="M110,41 Q117,39 122,42" stroke="#8b6914" stroke-width="2.5" fill="none" stroke-linecap="round"/>

  <!-- 左眼 -->
  <ellipse cx="86" cy="52" rx="10" ry="11" fill="white" stroke="#333" stroke-width="1"/>
  <ellipse cx="87" cy="53" rx="5.5" ry="6" fill="#2196F3"/>
  <ellipse cx="87" cy="53" rx="3" ry="3.5" fill="#1565C0"/>
  <circle cx="85" cy="50" r="2" fill="white" opacity="0.8"/>
  <!-- 右眼 -->
  <ellipse cx="114" cy="52" rx="10" ry="11" fill="white" stroke="#333" stroke-width="1"/>
  <ellipse cx="113" cy="53" rx="5.5" ry="6" fill="#2196F3"/>
  <ellipse cx="113" cy="53" rx="3" ry="3.5" fill="#1565C0"/>
  <circle cx="111" cy="50" r="2" fill="white" opacity="0.8"/>

  <!-- 鼻子 -->
  <path d="M98,60 Q100,65 102,60" stroke="rgba(180,130,90,0.5)" stroke-width="1.5" fill="none"/>

  <!-- 嘴巴 - 自信微笑 -->
  <path d="M90,72 Q95,70 100,71 Q105,70 110,72" stroke="#c0392b" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M93,73 Q100,77 107,73" fill="rgba(192,57,43,0.3)"/>

  <!-- 下巴线 -->
  <path d="M80,80 Q100,90 120,80" stroke="rgba(200,150,100,0.2)" stroke-width="1" fill="none"/>

  <!-- 肩章/肩部装饰线 -->
  <path d="M70,100 Q72,97 78,97" stroke="#f5d442" stroke-width="2" fill="none"/>
  <path d="M130,100 Q128,97 122,97" stroke="#f5d442" stroke-width="2" fill="none"/>
</svg>
